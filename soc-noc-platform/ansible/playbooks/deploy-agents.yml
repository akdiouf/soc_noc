---
# Playbook de déploiement des agents de monitoring sur les serveurs
# Usage: ansible-playbook -i inventory/hosts.yml playbooks/deploy-agents.yml -e noc_backend_ip=<IP>
#
# Variables requises :
#   noc_backend_ip  IP ou FQDN de la plateforme NOC/SOC (obligatoire)
#                   Exemple: -e noc_backend_ip=213.199.42.187

- name: Déployer les agents de monitoring sur les serveurs Linux
  hosts: linux_servers
  become: true
  gather_facts: true

  vars:
    prometheus_node_exporter_version: "1.7.0"
    filebeat_version: "8.11.0"
    wazuh_agent_version: "4.7.0"
    noc_backend_ip: >-
      {{ hostvars[groups['noc_platform'][0]]['ansible_host']
         if 'noc_platform' in groups and groups['noc_platform'] | length > 0
         else '' }}
    noc_api_url: "http://{{ noc_backend_ip }}:8000"
    noc_api_user: "admin"
    noc_api_password: "ChangeMe123!"

  pre_tasks:
    - name: Vérifier que noc_backend_ip est défini
      assert:
        that: noc_backend_ip | length > 0
        fail_msg: >
          La variable noc_backend_ip est obligatoire.
          Passez-la avec : -e noc_backend_ip=<IP_PLATEFORME>
          ou assurez-vous que le groupe noc_platform est présent dans l'inventaire.

    - import_tasks: tasks/apt-pre.yml

  tasks:
    # ─── Node Exporter (métriques système) ────────────────────────────────────
    - name: Créer l'utilisateur node_exporter
      user:
        name: node_exporter
        system: true
        shell: /bin/false
        create_home: no

    - name: Télécharger Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ prometheus_node_exporter_version }}/node_exporter-{{ prometheus_node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: '0644'

    - name: Extraire Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /usr/local/bin/
        remote_src: true
        extra_opts: ["--strip-components=1"]
        include:
          - "node_exporter-{{ prometheus_node_exporter_version }}.linux-amd64/node_exporter"

    - name: Service systemd pour Node Exporter
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter \
            --collector.systemd \
            --collector.processes \
            --collector.tcpstat \
            --web.listen-address=:9100
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Démarrer Node Exporter
      systemd:
        name: node_exporter
        state: started
        enabled: true
        daemon_reload: true

    # ─── Filebeat (envoi des logs) ─────────────────────────────────────────────
    - name: Supprimer l'ancienne clé GPG Elastic si présente
      file:
        path: /usr/share/keyrings/elastic.gpg
        state: absent
      when: ansible_os_family == "Debian"

    - name: Ajouter la clé GPG Elastic (déarmorisée)
      shell: >
        curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch
        | gpg --dearmor -o /usr/share/keyrings/elastic.gpg
        && chmod 0644 /usr/share/keyrings/elastic.gpg
      when: ansible_os_family == "Debian"

    - name: Ajouter le dépôt Elastic 8.x
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/elastic.gpg] https://artifacts.elastic.co/packages/8.x/apt stable main"
        filename: elastic-8.x
        state: present
      when: ansible_os_family == "Debian"

    - name: Installer Filebeat
      apt:
        name: "filebeat={{ filebeat_version }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Configurer Filebeat
      copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          filebeat.inputs:
            - type: log
              enabled: true
              paths:
                - /var/log/*.log
                - /var/log/syslog
                - /var/log/auth.log
              fields:
                host_type: linux_server
                site: "{{ site | default('primary') }}"

            - type: log
              enabled: true
              paths:
                - /var/log/nginx/*.log
              fields:
                service: nginx

          output.logstash:
            hosts: ["{{ noc_backend_ip }}:5044"]

          logging.level: warning
      notify: restart filebeat

    - name: Démarrer Filebeat
      systemd:
        name: filebeat
        state: started
        enabled: true

    # ─── Wazuh Agent (SIEM) ────────────────────────────────────────────────────
    - name: Supprimer l'ancienne clé GPG Wazuh si présente
      file:
        path: /usr/share/keyrings/wazuh.gpg
        state: absent

    - name: Ajouter la clé GPG Wazuh (déarmorisée)
      shell: >
        curl -fsSL https://packages.wazuh.com/key/GPG-KEY-WAZUH
        | gpg --dearmor -o /usr/share/keyrings/wazuh.gpg
        && chmod 0644 /usr/share/keyrings/wazuh.gpg

    - name: Ajouter le dépôt Wazuh 4.x
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
        filename: wazuh
        state: present
      when: ansible_os_family == "Debian"

    - name: Installer Wazuh Agent
      apt:
        name: "wazuh-agent={{ wazuh_agent_version }}-1"
        state: present
      when: ansible_os_family == "Debian"

    - name: Configurer le Wazuh Agent
      lineinfile:
        path: /var/ossec/etc/ossec.conf
        regexp: '<address>.*</address>'
        line: "    <address>{{ noc_backend_ip }}</address>"

    - name: Enregistrer l'agent Wazuh
      command: >
        /var/ossec/bin/agent-auth
        -m {{ noc_backend_ip }}
        -A {{ inventory_hostname }}
      args:
        creates: /var/ossec/etc/client.keys

    - name: Démarrer Wazuh Agent
      systemd:
        name: wazuh-agent
        state: started
        enabled: true

    # ─── Enregistrement sur la plateforme NOC/SOC ─────────────────────────────
    - name: Obtenir un token JWT de la plateforme
      uri:
        url: "{{ noc_api_url }}/api/v1/auth/login"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ noc_api_user }}"
          password: "{{ noc_api_password }}"
        status_code: 200
      register: auth_response
      delegate_to: localhost
      become: false
      no_log: true

    - name: Vérifier si l'agent est déjà enregistré
      uri:
        url: "{{ noc_api_url }}/api/v1/devices?search={{ ansible_host }}"
        method: GET
        headers:
          Authorization: "Bearer {{ auth_response.json.access_token }}"
        status_code: 200
      register: existing_devices
      delegate_to: localhost
      become: false

    - name: Enregistrer l'agent sur la plateforme (création)
      uri:
        url: "{{ noc_api_url }}/api/v1/devices"
        method: POST
        headers:
          Authorization: "Bearer {{ auth_response.json.access_token }}"
        body_format: json
        body:
          name: "{{ inventory_hostname }}"
          hostname: "{{ ansible_hostname }}"
          ip_address: "{{ ansible_host }}"
          device_type: "server"
          site: "{{ site | default('primary') }}"
          monitoring_protocol: "snmp_v2c"
          poll_interval: 60
          is_monitored: true
          is_critical: false
          description: "Déployé automatiquement par Ansible"
          tags: ["ansible", "linux", "{{ site | default('primary') }}"]
        status_code: 201
      delegate_to: localhost
      become: false
      when: existing_devices.json['total'] == 0

    - name: Mémoriser l'ID de l'agent existant
      set_fact:
        existing_device_id: "{{ existing_devices.json['items'][0]['id'] }}"
      when: existing_devices.json['total'] > 0

    - name: Mettre à jour l'agent sur la plateforme (si déjà existant)
      uri:
        url: "{{ noc_api_url }}/api/v1/devices/{{ existing_device_id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ auth_response.json.access_token }}"
        body_format: json
        body:
          hostname: "{{ ansible_hostname }}"
          ip_address: "{{ ansible_host }}"
          is_monitored: true
          description: "Déployé automatiquement par Ansible"
        status_code: 200
      delegate_to: localhost
      become: false
      when:
        - existing_devices.json['total'] > 0
        - existing_device_id is defined

  handlers:
    - name: restart filebeat
      systemd:
        name: filebeat
        state: restarted

# ─── Équipements réseau (SNMP) ─────────────────────────────────────────────────
- name: Configurer SNMP sur les équipements réseau Cisco
  hosts: cisco_devices
  gather_facts: no
  connection: network_cli

  tasks:
    - name: Activer SNMP v3 sur Cisco
      ios_config:
        lines:
          - "snmp-server group NOC_GROUP v3 priv"
          - "snmp-server user noc_monitor NOC_GROUP v3 auth sha {{ snmp_auth_password }} priv aes 128 {{ snmp_priv_password }}"
          - "snmp-server host {{ noc_backend_ip }} version 3 priv noc_monitor"
          - "snmp-server enable traps"
        save_when: modified

    - name: Activer NetFlow v5
      ios_config:
        lines:
          - "ip flow-export version 5"
          - "ip flow-export destination {{ noc_backend_ip }} 2055"
          - "ip flow-cache timeout active 1"
          - "ip flow-cache timeout inactive 15"
        save_when: modified

    - name: Activer Syslog
      ios_config:
        lines:
          - "logging host {{ noc_backend_ip }} transport udp port 514"
          - "logging trap informational"
          - "service timestamps log datetime msec"
        save_when: modified
