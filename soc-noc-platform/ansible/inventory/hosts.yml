---
all:
  children:
    # ─── Plateforme NOC/SOC ─────────────────────────────────────────────────────
    noc_platform:
      hosts:
        noc-server-01:
          ansible_host: 10.0.0.10
          ansible_user: sysadmin

    # ─── Serveurs Datacenter Principal ─────────────────────────────────────────
    linux_servers:
      children:
        primary_servers:
          hosts:
            srv-web-01:
              ansible_host: 192.168.1.100
              site: primary
            srv-web-02:
              ansible_host: 192.168.1.101
              site: primary
            srv-db-01:
              ansible_host: 192.168.1.110
              site: primary
            srv-db-02:
              ansible_host: 192.168.1.111
              site: primary
            srv-virt-01:
              ansible_host: 192.168.1.120
              site: primary

        # ─── Serveurs Site de Repli ─────────────────────────────────────────
        failover_servers:
          hosts:
            srv-dr-web-01:
              ansible_host: 192.168.2.100
              site: failover
            srv-dr-db-01:
              ansible_host: 192.168.2.110
              site: failover

    # ─── Équipements réseau ─────────────────────────────────────────────────────
    cisco_devices:
      hosts:
        core-router-01:
          ansible_host: 192.168.1.1
          ansible_network_os: ios
        core-router-02:
          ansible_host: 192.168.1.2
          ansible_network_os: ios
        dist-switch-01:
          ansible_host: 192.168.1.10
          ansible_network_os: ios
        dist-switch-02:
          ansible_host: 192.168.1.11
          ansible_network_os: ios
        firewall-01:
          ansible_host: 192.168.1.254
          ansible_network_os: asa

  vars:
    ansible_user: admin
    ansible_ssh_private_key_file: ~/.ssh/datacenter_key
    snmp_auth_password: "{{ vault_snmp_auth_password }}"
    snmp_priv_password: "{{ vault_snmp_priv_password }}"
