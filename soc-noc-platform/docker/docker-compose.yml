#version: "3.9"

networks:
  soc_noc_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  influxdb_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  elasticsearch_data:
  grafana_data:
  prometheus_data:
  wazuh_data:
  wazuh_indexer_data:
  netbox_data:
  shuffle_opensearch_data:
  shuffle_apps:
  shuffle_files:
  misp_data:
  misp_db_data:
  cortex_es_data:
  cortex_jobs:

services:
  # ─────────────────────────────────────────────
  # DATABASES
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: soc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: socnoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePass123}
      POSTGRES_DB: socnoc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socnoc -d socnoc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7-alpine
    container_name: soc_influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-SecureP@ss123}
      DOCKER_INFLUXDB_INIT_ORG: socnoc
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-my-super-secret-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.11

  redis:
    image: redis:7-alpine
    container_name: soc_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-SecureP@ss123}
    volumes:
      - redis_data:/data
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.12

  # ─────────────────────────────────────────────
  # MESSAGE BROKER
  # ─────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: soc_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.13

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: soc_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka
    ports:
      - "29092:29092"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.14

  # ─────────────────────────────────────────────
  # LOG MANAGEMENT (ELK STACK)
  # ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: soc_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.20
    ulimits:
      memlock:
        soft: -1
        hard: -1

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: soc_logstash
    restart: unless-stopped
    depends_on:
      - elasticsearch
      - kafka
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config:/usr/share/logstash/config
    ports:
      - "5800:5140/udp"
      - "5800:5140/tcp"
      - "5044:5044"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.21

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: soc_kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: http://localhost:8090/kibana
    ports:
      - "5601:5601"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.22

  # ─────────────────────────────────────────────
  # METRICS (PROMETHEUS + GRAFANA)
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: soc_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=90d"
      - "--web.external-url=http://localhost:8090/prometheus/"
      - "--web.route-prefix=/prometheus/"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - ./prometheus/targets:/etc/prometheus/targets
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.30

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: soc_alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.external-url=http://localhost:8090/alerts/"
      - "--web.route-prefix=/alerts/"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.31

  grafana:
    image: grafana/grafana:10.2.0
    container_name: soc_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - influxdb
      - elasticsearch
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-SecureP@ss123}
      GF_INSTALL_PLUGINS: grafana-worldmap-panel,grafana-piechart-panel,grafana-clock-panel
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
      GF_SERVER_ROOT_URL: http://localhost:8090/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.32

  # ─────────────────────────────────────────────
  # SNMP EXPORTER (Réseau + Physique)
  # ─────────────────────────────────────────────
  snmp-exporter:
    image: prom/snmp-exporter:v0.24.0
    container_name: soc_snmp_exporter
    restart: unless-stopped
    volumes:
      - ./snmp-exporter/snmp.yml:/etc/snmp_exporter/snmp.yml
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.33

  # ─────────────────────────────────────────────
  # CMDB (NETBOX)
  # ─────────────────────────────────────────────
  netbox:
    image: netboxcommunity/netbox:v3.7-2.8.0
    container_name: soc_netbox
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@datacenter.local
      SUPERUSER_PASSWORD: ${NETBOX_PASSWORD:-SecureP@ss123}
      ALLOWED_HOSTS: "*"
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: socnoc
      DB_PASSWORD: ${POSTGRES_PASSWORD:-SecurePass123}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-SecureP@ss123}
      SECRET_KEY: ${NETBOX_SECRET_KEY:-36fqE9KQvJk0i8abe8HCkdZfydfZrzU7VUohHVeljFnBkozQtqbQQyt6xpkI3O4TXNm770w8TXGnaJ_WizRbfA}
      FORCE_SCRIPT_NAME: /netbox
      BASE_PATH: netbox
      LOGIN_REQUIRED: "false"
    volumes:
      - netbox_data:/opt/netbox/netbox/media
      - ./netbox/extra.py:/etc/netbox/config/extra.py:ro
    ports:
      - "8080:8080"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.40

  # ─────────────────────────────────────────────
  # SOC - WAZUH SIEM
  # ─────────────────────────────────────────────
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.0
    container_name: soc_wazuh_dashboard
    restart: unless-stopped
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    environment:
      INDEXER_URL: https://wazuh-indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: admin
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: kibanaserver
      WAZUH_API_URL: https://wazuh-manager
      WAZUH_API_PORT: 55000
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:-MyS3cr37P450r.*-}
      SERVER_SSL_ENABLED: "false"
      OPENSEARCH_SSL_VERIFICATIONMODE: none
      SERVER_BASEPATH: /wazuh
      SERVER_REWRITEBASEPATH: "true"
    ports:
      - "5602:5601"
    volumes:
      - ./wazuh/config/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./wazuh/config/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.52

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.0
    container_name: soc_wazuh_indexer
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "bootstrap.memory_lock=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./wazuh/opensearch.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ./wazuh/opensearch-security/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro
      - ./wazuh/certs/indexer.pem:/usr/share/wazuh-indexer/certs/indexer.pem:ro
      - ./wazuh/certs/indexer-key.pem:/usr/share/wazuh-indexer/certs/indexer-key.pem:ro
      - ./wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem:ro
      - ./wazuh/certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem:ro
      - ./wazuh/certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem:ro
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.51
        aliases:
          - wazuh.indexer

  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.0
    container_name: soc_wazuh_manager
    restart: unless-stopped
    depends_on:
      - wazuh-indexer
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: admin
      FILEBEAT_SSL_VERIFICATION_MODE: none
    volumes:
      - wazuh_data:/var/ossec/data
      - ./wazuh/config:/wazuh-config-mount/etc
    ports:
      - "1514:1514/udp"
      - "1515:1515"
      - "55000:55000"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.50

  # ─────────────────────────────────────────────
  # SOC - THREAT INTELLIGENCE (MISP)
  # ─────────────────────────────────────────────
  misp-db:
    image: mariadb:10.11
    container_name: soc_misp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MISP_MYSQL_ROOT_PASSWORD:-MISPRootP@ss2024}
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_MYSQL_PASSWORD:-MISPDbP@ss2024}
    volumes:
      - misp_db_data:/var/lib/mysql
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.63
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  misp:
    image: ghcr.io/misp/misp-docker/misp-core:latest
    container_name: soc_misp
    restart: unless-stopped
    depends_on:
      misp-db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      MYSQL_HOST: misp-db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_MYSQL_PASSWORD:-MISPDbP@ss2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-SecureP@ss123}
      BASE_URL: https://akisoc.team.akilee.tech/misp
      DISABLE_SSL_REDIRECT: "true"
      MISP_UUID: ${MISP_UUID:-}
      SALT: ${MISP_SALT:-Rrtf1tHXXBdFtN5d8VD4rQ==}
      MISP_ORG: ${MISP_ORG:-SOCNOC}
      SETTING_EMAIL: ${MISP_ADMIN_EMAIL:-admin@socnoc.local}
      ADMIN_EMAIL: ${MISP_ADMIN_EMAIL:-admin@socnoc.local}
      ADMIN_PASSWORD: ${MISP_ADMIN_PASSWORD:-MISPAdmin@2024}
      MISP_MODULES_FQDN: http://misp-modules:6666
      CRON_USER_ID: 1
      WORKERS: 1
    volumes:
      - misp_data:/var/www/MISP/app/files
    ports:
      - "8081:80"
      - "9443:443"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.62

  misp-modules:
    image: ghcr.io/misp/misp-docker/misp-modules:latest
    container_name: soc_misp_modules
    restart: unless-stopped
    environment:
      REDIS_BACKEND: redis
      REDIS_PORT: 6379
      REDIS_PW: ${REDIS_PASSWORD:-SecureP@ss123}
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.64

  # ─────────────────────────────────────────────
  # SOC - INCIDENT RESPONSE
  # ─────────────────────────────────────────────
  thehive:
    image: strangebee/thehive:5.2
    container_name: soc_thehive
    restart: unless-stopped
    depends_on:
      elasticsearch-cortex:
        condition: service_healthy
      cortex:
        condition: service_started
    environment:
      - JVM_OPTS=-Xms512m -Xmx1g -Dconfig.file=/etc/thehive/application.conf
    volumes:
      - ./thehive/application.conf:/etc/thehive/application.conf:ro
      - ./thehive/data:/opt/thehive/data
    ports:
      - "9070:9000"   # 9000 réservé Hyper-V → accès direct http://localhost:9070
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.60

  elasticsearch-cortex:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.15
    container_name: soc_elasticsearch_cortex
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=cortex-cluster
      - bootstrap.memory_lock=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - cortex_es_data:/usr/share/elasticsearch/data
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.65

  cortex:
    image: thehiveproject/cortex:3.1.7
    container_name: soc_cortex
    restart: unless-stopped
    depends_on:
      - elasticsearch-cortex
    environment:
      - JVM_OPTS=-Xms512m -Xmx1g -Dconfig.file=/etc/cortex/application.conf
    volumes:
      - ./cortex/application.conf:/etc/cortex/application.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - cortex_jobs:/tmp/cortex-jobs
    ports:
      - "9071:9001"   # 9001 réservé Hyper-V → accès direct http://localhost:9071
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.61

  # ─────────────────────────────────────────────
  # SOC - SOAR (SHUFFLE)
  # ─────────────────────────────────────────────
  shuffle-opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: shuffle-opensearch
    hostname: shuffle-opensearch
    restart: unless-stopped
    environment:
      - "discovery.type=single-node"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - shuffle_opensearch_data:/usr/share/opensearch/data
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.72

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:latest
    container_name: soc_shuffle_backend
    restart: unless-stopped
    depends_on:
      - shuffle-opensearch
    environment:
      DATASTORE_EMULATOR_HOST: shuffle-database:8000
      SHUFFLE_APP_HOTLOAD_FOLDER: /shuffle-apps
      SHUFFLE_FILE_LOCATION: /shuffle-files
      SHUFFLE_OPENSEARCH_URL: http://shuffle-opensearch:9200
      SHUFFLE_OPENSEARCH_SKIP_SSL_VERIFY: "true"
      ORG_ID: Shuffle
      ENVIRONMENT_NAME: Shuffle
      SHUFFLE_DEFAULT_USERNAME: admin
      SHUFFLE_DEFAULT_PASSWORD: ${SHUFFLE_PASSWORD:-SecureP@ss123}
      BASE_URL: http://shuffle-backend:5001
      OUTER_HOSTNAME: shuffle-backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - shuffle_apps:/shuffle-apps
      - shuffle_files:/shuffle-files
    ports:
      - "5001:5001"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.70

  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    container_name: soc_shuffle_frontend
    hostname: shuffle-frontend
    restart: unless-stopped
    depends_on:
      - shuffle-backend
    environment:
      # BACKEND_HOSTNAME est utilisé par le nginx interne du container pour
      # proxier les appels /api/ vers le backend. Ne pas mettre localhost ici.
      BACKEND_HOSTNAME: shuffle-backend
      BACKEND_PORT: "5001"
    ports:
      - "3002:80"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.71

  # Orborus — moteur d'exécution des workflows Shuffle (lance les workers Docker)
  shuffle-orborus:
    image: ghcr.io/shuffle/shuffle-orborus:latest
    container_name: soc_shuffle_orborus
    restart: unless-stopped
    depends_on:
      - shuffle-backend
    environment:
      ORG_ID: Shuffle
      ENVIRONMENT_NAME: Shuffle
      BASE_URL: http://shuffle-backend:5001
      DOCKER_API_VERSION: "1.40"
      SHUFFLE_APP_SDK_TIMEOUT: "300"
      SHUFFLE_ORBORUS_EXECUTION_CONCURRENCY: "5"
      SHUFFLE_PASS_WORKER_PROXY: "TRUE"
      SHUFFLE_PASS_APP_PROXY: "TRUE"
      CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.73

  # ─────────────────────────────────────────────
  # BACKEND (SOC/NOC API)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: soc_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      influxdb:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://socnoc:${POSTGRES_PASSWORD:-SecurePass123}@postgres:5432/socnoc_db
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-my-super-secret-token}
      INFLUXDB_ORG: socnoc
      INFLUXDB_BUCKET: metrics
      REDIS_URL: redis://:${REDIS_PASSWORD:-SecureP@ss123}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      ENVIRONMENT: development
      FIRST_SUPERUSER_USERNAME: ${FIRST_SUPERUSER_USERNAME:-admin}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-admin@socnoc.local}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
      FIRST_SUPERUSER_FULLNAME: ${FIRST_SUPERUSER_FULLNAME:-Administrateur SOC/NOC}
      MISP_URL: http://misp:80
      MISP_API_KEY: ${MISP_API_KEY:-}
      MISP_ORG: ${MISP_ORG:-SOCNOC}
      MISP_VERIFY_CERT: "false"
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.80

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: soc_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      DATABASE_URL: postgresql+asyncpg://socnoc:${POSTGRES_PASSWORD:-SecurePass123}@postgres:5432/socnoc_db
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-my-super-secret-token}
      REDIS_URL: redis://:${REDIS_PASSWORD:-SecureP@ss123}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MISP_URL: http://misp:80
      MISP_API_KEY: ${MISP_API_KEY:-}
      MISP_ORG: ${MISP_ORG:-SOCNOC}
      MISP_VERIFY_CERT: "false"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.81

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: soc_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-SecureP@ss123}@redis:6379/0
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.82

  # ─────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: soc_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.90

  # ─────────────────────────────────────────────
  # REVERSE PROXY
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: soc_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - grafana
      - kibana
      - prometheus
      - alertmanager
      - thehive
      - cortex
      - wazuh-dashboard
      - netbox
      - shuffle-frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "8090:80"
      - "4443:443"
    networks:
      soc_noc_net:
        ipv4_address: 172.20.0.100
