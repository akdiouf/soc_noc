global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    datacenter: 'primary'

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Backend SOC/NOC API
  - job_name: 'socnoc-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics

  # SNMP Exporter — équipements réseau
  - job_name: 'snmp-network'
    static_configs:
      - targets:
          - 192.168.1.1    # Routeur Core
          - 192.168.1.2    # Switch Distribution
          - 192.168.1.3    # Firewall
    metrics_path: /snmp
    params:
      module: [if_mib]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # SNMP Exporter — UPS (RFC 1628)
  - job_name: 'snmp-ups'
    static_configs:
      - targets:
          - 192.168.10.10  # UPS APC 1
          - 192.168.10.11  # UPS Eaton 1
    metrics_path: /snmp
    params:
      module: [ups]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # Node Exporter — serveurs Linux
  - job_name: 'node-exporter'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/nodes.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # Elasticsearch
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    metrics_path: /_prometheus/metrics
