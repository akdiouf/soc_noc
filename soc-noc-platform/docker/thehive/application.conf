# TheHive 5 — stockage local BerkeleyJE + index Elasticsearch

play.http.context = "/thehive"
application.baseUrl = "http://localhost:8090/thehive"

# ── Play secret key ───────────────────────────────────────────────────────────
play.http.secret.key = "thehive-changeme-use-a-long-random-string-in-production"

# ── JanusGraph + BerkeleyJE (base locale) ─────────────────────────────────────
db.janusgraph {
  storage.backend          = "berkeleyje"
  storage.directory        = "/opt/thehive/data/db"

  index.search.backend                                    = "elasticsearch"
  index.search.hostname                                   = ["elasticsearch"]
  index.search.elasticsearch.index-name                  = "thehive"
  index.search.elasticsearch.index.number_of_shards      = 1
  index.search.elasticsearch.index.number_of_replicas    = 0
}

# ── Fichiers attachés ─────────────────────────────────────────────────────────
storage {
  provider             = localfs
  localfs.location     = "/opt/thehive/data/files"
}
