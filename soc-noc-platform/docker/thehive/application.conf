# TheHive 5 — stockage local BerkeleyJE + index Elasticsearch

play.http.context = "/thehive"
application.baseUrl = "https://akisoc.team.akilee.tech/thehive"

# ── Play secret key ───────────────────────────────────────────────────────────
play.http.secret.key = "thehive-changeme-use-a-long-random-string-in-production"

# ── JanusGraph + BerkeleyJE (base locale) ─────────────────────────────────────
db.janusgraph {
  storage.backend   = berkeleyje
  storage.directory = "/opt/thehive/data/db"

  index.search {
    backend    = elasticsearch
    hostname   = ["elasticsearch-cortex"]
    port       = 9200
    index-name = thehive
  }
}

# ── Fichiers attachés ─────────────────────────────────────────────────────────
storage {
  provider           = localfs
  localfs.location   = "/opt/thehive/data/files"
}
