apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: socnoc
      defaultBucket: metrics
    secureJsonData:
      token: ${INFLUXDB_TOKEN:-my-super-secret-token}
    editable: false

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      index: "soc-noc-*"
      timeField: "@timestamp"
      esVersion: "8.0.0"
    editable: false
