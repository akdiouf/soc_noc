input {
  # Syslog UDP
  udp {
    port => 5140
    codec => plain
    type => "syslog"
  }

  # Syslog TCP
  tcp {
    port => 5140
    codec => line
    type => "syslog"
  }

  # Filebeat / Beats agents
  beats {
    port => 5044
    type => "beats"
  }

  # Kafka — logs normalisés du backend
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["noc.syslog", "soc.events", "noc.netflow"]
    codec => json
    type => "kafka"
    group_id => "logstash"
  }

}

filter {
  # Parsing Syslog
  if [type] == "syslog" {
    grok {
      match => {
        "message" => [
          "<%{POSINT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{SYSLOGHOST:logsource} %{PROG:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:message}",
          "<%{POSINT:priority}>%{GREEDYDATA:message}"
        ]
      }
      overwrite => ["message"]
    }

    # Calculer facility et severity depuis la priorité
    ruby {
      code => "
        priority = event.get('priority').to_i rescue 0
        event.set('facility', priority >> 3)
        event.set('severity', priority & 7)
        severity_names = %w[emergency alert critical error warning notice info debug]
        event.set('severity_label', severity_names[priority & 7] || 'unknown')
      "
    }

    # Détecter le type d'équipement
    if [logsource] {
      mutate {
        add_field => { "[@metadata][index_prefix]" => "noc-syslog" }
      }
    }
  }

  # Enrichissement GeoIP pour les adresses IP externes
  if [source_ip] and [source_ip] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)/ {
    geoip {
      source => "source_ip"
      target => "geoip"
    }
  }

  # Détection de patterns de sécurité
  if [message] =~ /(?i)authentication failure|failed login|invalid user/ {
    mutate {
      add_tag => ["auth_failure", "security"]
      add_field => { "event_category" => "authentication" }
    }
  }

  if [message] =~ /(?i)interface.*down|link.*down/ {
    mutate {
      add_tag => ["link_down", "noc"]
      add_field => { "event_category" => "network" }
    }
  }

  if [message] =~ /(?i)temperature|thermal|overheat/ {
    mutate {
      add_tag => ["thermal", "physical"]
      add_field => { "event_category" => "environmental" }
    }
  }

  if [message] =~ /(?i)ups|power fail|battery/ {
    mutate {
      add_tag => ["power", "physical"]
      add_field => { "event_category" => "power" }
    }
  }

  # Timestamp normalisé
  date {
    match => ["timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "ISO8601"]
    target => "@timestamp"
    timezone => "UTC"
  }
}

output {
  if [type] == "beats" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "noc-agents-%{[fields][host_type]:unknown}-%{+YYYY.MM.dd}"
      manage_template => false
      action => "index"
    }
  } else {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "soc-noc-%{[@metadata][index_prefix]:logs}-%{+YYYY.MM.dd}"
      manage_template => false
      action => "index"
    }
  }

  # Debug (désactiver en production)
  # stdout { codec => rubydebug }
}
