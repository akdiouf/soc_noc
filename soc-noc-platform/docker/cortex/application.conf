# Cortex 3 — Elasticsearch backend

play.http.context = "/cortex"
application.baseUrl = "http://localhost:8090/cortex"

# ── Elasticsearch ─────────────────────────────────────────────────────────────
search {
  uri         = "http://elasticsearch-cortex:9200"
  index       = "cortex"
  nbshards    = 1
  nbreplicas  = 0
  keepalive   = "1m"
  pagesize    = 10
  version     = 6
}

# ── Play secret key ───────────────────────────────────────────────────────────
play.http.secret.key = "cortex-changeme-use-a-long-random-string-in-production"

# ── Analyzers & Responders ────────────────────────────────────────────────────
analyzer {
  urls = [
    "https://download.thehive-project.org/analyzers.json"
  ]
  fork-join-executor {
    parallelism-min  = 2
    parallelism-factor = 2.0
    parallelism-max  = 4
  }
}

responder {
  urls = [
    "https://download.thehive-project.org/responders.json"
  ]
}
