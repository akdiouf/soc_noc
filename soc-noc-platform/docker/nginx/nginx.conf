worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Résolveur DNS Docker interne — résolution dynamique au moment des requêtes,
    # pas au démarrage (évite les crashes quand un upstream n'est pas encore prêt).
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # ─── HTTP ────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 100m;

        # ── API Backend ──────────────────────────────────────────────────────────
        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
            proxy_buffering off;
        }

        # ── WebSocket ────────────────────────────────────────────────────────────
        location /ws/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600;
        }

        # ── API Docs ─────────────────────────────────────────────────────────────
        location /docs {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
        }

        location /redoc {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
        }

        # ── Grafana ──────────────────────────────────────────────────────────────
        location /grafana/ {
            set $grafana http://grafana:3000;
            proxy_pass $grafana;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Kibana ───────────────────────────────────────────────────────────────
        location /kibana {
            set $kibana http://kibana:5601;
            proxy_pass $kibana;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Prometheus ───────────────────────────────────────────────────────────
        location /prometheus/ {
            set $prometheus http://prometheus:9090;
            proxy_pass $prometheus;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Alertmanager ─────────────────────────────────────────────────────────
        location /alerts/ {
            set $alertmanager http://alertmanager:9093;
            proxy_pass $alertmanager;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── TheHive ──────────────────────────────────────────────────────────────
        location = /thehive/ { return 302 /thehive; }
        location /thehive {
            set $thehive http://thehive:9000;
            proxy_pass $thehive;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            proxy_buffer_size   16k;
            proxy_buffers       4 32k;
        }

        # ── Cortex ───────────────────────────────────────────────────────────────
        location = /cortex/ { return 302 /cortex; }
        location /cortex {
            set $cortex http://cortex:9001;
            proxy_pass $cortex;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # ── Wazuh Dashboard ──────────────────────────────────────────────────────
        location /wazuh {
            set $wazuh http://wazuh-dashboard:5601;
            proxy_pass $wazuh;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 120;
        }

        # ── NetBox ───────────────────────────────────────────────────────────────
        location /netbox/static/ {
            proxy_pass http://netbox:8080/static/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /netbox/media/ {
            proxy_pass http://netbox:8080/media/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /netbox/ {
            set $netbox http://netbox:8080;
            proxy_pass $netbox;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /netbox {
            return 301 $scheme://$http_host/netbox/;
        }

        # ── Shuffle SOAR ─────────────────────────────────────────────────────────
        location /shuffle/ {
            set $shuffle http://shuffle-frontend:80;
            proxy_pass $shuffle/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── MISP Threat Intelligence ─────────────────────────────────────────────
        location /misp/ {
            set $misp http://misp:80;
            proxy_pass $misp/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120;
            client_max_body_size 50m;
        }

        # ── Frontend React (catch-all) ────────────────────────────────────────────
        location / {
            set $frontend http://frontend:80;
            proxy_pass $frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
