worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ─── Upstreams ─────────────────────────────────────────────────────────────
    upstream backend        { server backend:8000;          keepalive 32; }
    upstream frontend       { server frontend:80; }
    upstream grafana        { server grafana:3000; }
    upstream kibana         { server kibana:5601; }
    upstream prometheus_up  { server prometheus:9090; }
    upstream alertmanager_up { server alertmanager:9093; }
    upstream thehive_up     { server thehive:9000; }
    upstream cortex_up      { server cortex:9001; }
    upstream wazuh_dash     { server wazuh-dashboard:5601; }
    upstream netbox_up      { server netbox:8080; }
    upstream shuffle_fe     { server shuffle-frontend:80; }

    # ─── HTTP (local test — no TLS) ───────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 100m;

        # ── API Backend ──────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
            proxy_buffering off;
        }

        # ── WebSocket ────────────────────────────────────────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600;
        }

        # ── API Docs ─────────────────────────────────────────────────────────
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # ── Grafana (GF_SERVER_SERVE_FROM_SUB_PATH=true) ─────────────────────
        # Grafana handles /grafana/ prefix itself; do not strip.
        location /grafana/ {
            proxy_pass http://grafana;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Kibana (SERVER_REWRITEBASEPATH=true, base=/kibana) ───────────────
        location /kibana {
            proxy_pass http://kibana;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Prometheus (--web.route-prefix=/prometheus/) ─────────────────────
        location /prometheus/ {
            proxy_pass http://prometheus_up;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Alertmanager (--web.route-prefix=/alerts/) ───────────────────────
        location /alerts/ {
            proxy_pass http://alertmanager_up;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── TheHive (play.http.context=/thehive) ─────────────────────────────
        # Play Framework ne route pas /thehive/ (trailing slash) → on redirige
        location = /thehive/ { return 302 /thehive; }
        location /thehive {
            proxy_pass http://thehive_up;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            proxy_buffer_size   16k;
            proxy_buffers       4 32k;
        }

        # ── Cortex (play.http.context=/cortex) ───────────────────────────────
        # Play Framework ne route pas /cortex/ (trailing slash) → on redirige
        location = /cortex/ { return 302 /cortex; }
        location /cortex {
            proxy_pass http://cortex_up;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # ── Wazuh Dashboard (serves HTTPS internally; we skip cert verification) ─
        location /wazuh {
            proxy_pass https://wazuh_dash;
            proxy_ssl_verify        off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # ── NetBox (FORCE_SCRIPT_NAME=/netbox) ───────────────────────────────
        location /netbox {
            proxy_pass http://netbox_up;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Shuffle SOAR ─────────────────────────────────────────────────────
        # Shuffle ne supporte pas les sous-chemins (subpath) nativement.
        # Son nginx interne gère lui-même le proxy /api/ -> shuffle-backend.
        # Acces direct recommande : http://localhost:3002
        # Cette route proxie le frontend (les appels API du SPA passeront
        # par le nginx interne de shuffle-frontend vers shuffle-backend).
        location /shuffle/ {
            proxy_pass http://shuffle_fe/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Frontend React (catch-all) ────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
